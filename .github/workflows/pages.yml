name: Website

# Publishes the pre re marketing site (index.html + assets/) to GitHub Pages, so the
# address the app's About dialog opens is a real page:
#   https://muhammadshanp.github.io/Pre-release-/
#
# Only the site files go out; the Android source in android/ is not published.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The repo root holds both the site and the Android app; only the former ships.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          cp -r assets _site/
          find _site -name '*.apk' -delete

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
